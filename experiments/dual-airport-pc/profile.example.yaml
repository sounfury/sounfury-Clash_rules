# 纯 JS 方案下 profile 只需占位（可挂任意本地空配置）。
# 节点源 / 策略组 / 规则 全部由 override.js 注入。
#
# Party：
#   1. 新建本地配置，内容可仅如下
#   2. 覆写挂 experiments/dual-airport-pc/override.js
#   3. 花云 YAML 放 work\proxies\；Hneko 用 http 订阅（url 写链接，path 写本地缓存）

mixed-port: 7890
mode: rule
proxies: []
proxy-groups: []
rules:
  - MATCH,DIRECT
